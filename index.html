<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFC7C8">
<title>For Alokaa 🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #FFC7C8;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* shared decor (cut from the Canva page 16) */
  .decor { position: fixed; pointer-events: none; z-index: 0; }
  .wave-top, .wave-bot { left: 0; right: 0; height: 20px; background-repeat: repeat-x; background-size: auto 100%; }
  .wave-top { top: 0; background-image: url(img/wave-top.webp); }
  .wave-bot { bottom: 0; height: 18px; background-image: url(img/wave-bot.webp); }
  .hearts-tr { top: 20px; right: 0; width: clamp(60px, 14vw, 120px); }
  .hearts-bl { bottom: 18px; left: 0; width: clamp(90px, 24vw, 270px); }

  /* one slide = one full-screen section; .stage keeps the Canva composition */
  section {
    position: fixed; inset: 0; z-index: 1;
    display: none; place-items: center;
    padding: 28px 12px;
  }
  section.on { display: grid; animation: fade .5s both; }
  .stage {
    position: relative;
    aspect-ratio: var(--ar);
    width: min(92vw, calc(80vh * var(--ar)), calc(80dvh * var(--ar)), 820px);
  }
  .stage > * { position: absolute; display: block; }
  .stage img, .stage button img { width: 100%; height: auto; display: block; }
  button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
  .no { transition: left .25s, top .25s; }
  .stage { container-type: inline-size; }
  /* the wide headline shrinks everything on phones; enlarge small text + buttons */
  #s2 .stage > :nth-child(2) { scale: 1.4; translate: 0 .6cqw; }
  #s2 .yes { scale: 1.25; translate: 0 1cqw; }
  #s2 .no  { scale: 1.4; translate: 0 .5cqw; }
  #s4 .stage > :nth-child(2) { scale: 1.4; translate: 0 -3cqw; }
  #s4 .stage > :nth-child(3) { scale: 1.15; }

  /* entrance animations; --d staggers them */
  .d1 { --d: .5s } .d2 { --d: 1s } .d3 { --d: 1.8s } .d4 { --d: 2.3s } .d5 { --d: 2.8s }
  .a-drop  { animation: drop .8s var(--d, 0s) both cubic-bezier(.2,1.4,.4,1); }
  .a-fade  { animation: fade .8s var(--d, 0s) both; }
  .a-pop   { animation: pop .6s var(--d, 0s) both cubic-bezier(.2,1.6,.4,1); }
  .a-zoom  { animation: zoom 1.2s var(--d, 0s) both cubic-bezier(.2,1.3,.4,1); }
  .a-glitch { animation: drop .6s both, glitch 2.5s .6s infinite; }
  /* entrance, then a loop that never stops */
  .a-drop.float, .a-zoom.float { animation-name: drop, float; animation-duration: .8s, 3s; animation-delay: var(--d, 0s), calc(var(--d, 0s) + .8s); animation-iteration-count: 1, infinite; animation-fill-mode: both; animation-timing-function: ease-out, ease-in-out; }
  .a-zoom.float { animation-name: zoom, float; animation-duration: 1.2s, 3s; animation-delay: var(--d, 0s), calc(var(--d, 0s) + 1.2s); }
  .a-zoom.beat { animation: zoom 1s var(--d, 0s) both, beat 1.4s calc(var(--d, 0s) + 1s) infinite; }
  .pulse img  { animation: pulse 1.3s ease-in-out infinite; }
  .wiggle img { animation: wiggle 2.4s 1.5s infinite; }

  @keyframes fade   { from { opacity: 0 } }
  @keyframes drop   { from { opacity: 0; transform: translateY(-60px) } }
  @keyframes pop    { from { opacity: 0; transform: scale(0) } }
  @keyframes zoom   { from { opacity: 0; transform: scale(.2) rotate(-12deg) } }
  @keyframes float  { 50% { transform: translateY(-8px) rotate(-1deg) } }
  @keyframes pulse  { 50% { transform: scale(1.08) } }
  @keyframes beat   { 0%, 40%, 100% { transform: scale(1) } 20% { transform: scale(1.06) } 30% { transform: scale(.98) } }
  @keyframes wiggle { 0%, 30%, 100% { transform: rotate(0) } 5%, 15%, 25% { transform: rotate(-10deg) scale(1.1) } 10%, 20% { transform: rotate(10deg) scale(1.1) } }
  @keyframes glitch { 0%, 88%, 100% { transform: none; filter: none }
    90% { transform: translate(-4px, 2px) skewX(8deg); filter: hue-rotate(60deg) }
    93% { transform: translate(4px, -2px) skewX(-8deg) }
    96% { transform: translate(-2px, 0); filter: hue-rotate(-60deg) } }

  /* replay pill, styled like the Canva buttons */
  .replay {
    position: fixed; left: 50%; bottom: max(36px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    padding: .55em 1.6em; font-size: 1.1rem; font-weight: 800;
    background: #FBB0EF; border: 2.5px solid #000; border-radius: 99px;
    box-shadow: 4px 5px 0 #000;
    animation: pop .6s 3s both cubic-bezier(.2,1.6,.4,1);
  }
  .mute {
    position: fixed; top: 26px; left: 10px; z-index: 5;
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff8; font-size: 1.2rem; display: none;
  }
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 9; pointer-events: none; animation: fall linear forwards; }
  .heart { position: fixed; z-index: 9; pointer-events: none; font-style: normal; translate: -50% -50%; animation: burst 1.3s cubic-bezier(.1,.8,.3,1) both; }
  @keyframes burst { 0% { transform: scale(0); opacity: 1 } 70% { opacity: 1 } 100% { transform: translate(var(--x), var(--y)) scale(1.2) rotate(25deg); opacity: 0 } }
  @keyframes fall { to { transform: translate(var(--x), 110vh) rotate(720deg) } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<img class="decor hearts-tr" src="img/hearts-tr.webp" alt="">
<img class="decor hearts-bl" src="img/hearts-bl.webp" alt="">
<div class="decor wave-top"></div>
<div class="decor wave-bot"></div>
<button class="mute" aria-label="mute music">🔊</button>
<audio id="song" src="song.mp3" loop preload="auto"></audio>

<section id="s1">
  <div class="stage" style="--ar:836/1122">
    <img class="a-drop float" style="left:0.00%;top:0.00%;width:100.00%" src="img/1-title.webp" alt="">
    <img class="a-fade d1" style="left:25.12%;top:49.82%;width:42.70%" src="img/1-sub.webp" alt="">
    <button class="a-pop d2 wiggle tap go" style="left:31.94%;top:70.23%;width:33.25%" aria-label="open your surprise"><img src="img/1-gift.webp" alt=""></button>
  </div>
</section>

<section id="s2">
  <div class="stage" style="--ar:1514/1436">
    <img class="a-zoom float" style="left:0.00%;top:0.00%;width:100.00%" src="img/2-title.webp" alt="">
    <img class="a-fade d3" style="left:19.88%;top:69.57%;width:65.32%" src="img/2-ask.webp" alt="">
    <button class="a-pop d4 pulse tap go yes" style="left:24.31%;top:75.42%;width:56.67%" aria-label="yess"><img src="img/2-yes.webp" alt=""></button>
    <button class="a-pop d5 tap no" style="left:38.44%;top:93.87%;width:28.34%" aria-label="no"><img src="img/2-no.webp" alt=""></button>
  </div>
</section>

<section id="s3">
  <div class="stage" style="--ar:1177/1479">
    <img class="a-zoom" style="left:0.00%;top:0.00%;width:100.00%" src="img/3-art.webp" alt="">
    <button class="a-pop d2 pulse tap go" style="left:0.00%;top:66.53%;width:100.00%" aria-label="continue"><img src="img/3-couple.webp" alt=""></button>
  </div>
</section>

<section id="s4">
  <div class="stage" style="--ar:1280/764">
    <img class="a-glitch" style="left:0.00%;top:0.00%;width:100.00%" src="img/4-err.webp" alt="">
    <img class="a-fade d1" style="left:21.95%;top:65.84%;width:57.89%" src="img/4-ask.webp" alt="">
    <button class="a-pop d2 pulse tap go" style="left:17.50%;top:76.96%;width:67.03%" aria-label="hmm"><img src="img/4-hmm.webp" alt=""></button>
  </div>
</section>

<section id="s5">
  <div class="stage" style="--ar:1084/1392">
    <img class="a-drop" style="left:0.00%;top:0.00%;width:100.00%" src="img/5-title.webp" alt="">
    <img class="a-pop d1" style="left:32.01%;top:12.64%;width:36.53%" src="img/5-phone.webp" alt="">
    <img class="a-fade d2" style="left:9.59%;top:74.07%;width:81.37%" src="img/5-cap.webp" alt="">
    <button class="a-pop d3 pulse tap go" style="left:42.34%;top:88.65%;width:15.68%" aria-label="next"><img src="img/5-next.webp" alt=""></button>
  </div>
</section>

<section id="s6">
  <div class="stage" style="--ar:990/1547">
    <img class="a-drop" style="left:0.00%;top:0.00%;width:100.00%" src="img/6-note.webp" alt="">
    <button class="a-pop d2 pulse tap go" style="left:42.32%;top:90.17%;width:15.35%" aria-label="next"><img src="img/6-next.webp" alt=""></button>
  </div>
</section>

<section id="s7">
  <div class="stage" style="--ar:916/585">
    <button class="a-pop pulse tap go" style="left:0.00%;top:0.00%;width:100.00%" aria-label="continue"><img src="img/7-text.webp" alt=""></button>
  </div>
</section>

<section id="s8">
  <div class="stage" style="--ar:843/1074">
    <img class="a-pop" style="left:0.00%;top:0.00%;width:100.00%" src="img/8-pic.webp" alt="">
    <button class="a-drop d1 pulse tap go" style="left:9.96%;top:71.42%;width:79.48%" aria-label="continue"><img src="img/8-word.webp" alt=""></button>
  </div>
</section>

<section id="s9">
  <div class="stage" style="--ar:961/1211">
    <button class="a-pop pulse tap go" style="left:0.00%;top:0.00%;width:100.00%" aria-label="continue"><img src="img/9-pic.webp" alt=""></button>
  </div>
</section>

<section id="s10">
  <div class="stage" style="--ar:1059/1043">
    <img class="a-pop" style="left:0.00%;top:0.00%;width:100.00%" src="img/10-pic.webp" alt="">
    <button class="a-drop d1 pulse tap go" style="left:24.36%;top:61.27%;width:54.86%" aria-label="continue"><img src="img/10-word.webp" alt=""></button>
  </div>
</section>

<section id="s11">
  <div class="stage" style="--ar:1195/903">
    <button class="a-drop d1 pulse tap go" style="left:0.00%;top:42.86%;width:62.68%" aria-label="continue"><img src="img/11-word.webp" alt=""></button>
    <img class="a-pop" style="left:57.24%;top:0.00%;width:42.76%" src="img/11-pic.webp" alt="">
  </div>
</section>

<section id="s12">
  <div class="stage" style="--ar:802/1108">
    <button class="a-pop pulse tap go" style="left:0.00%;top:0.00%;width:100.00%" aria-label="continue"><img src="img/12-pic.webp" alt=""></button>
  </div>
</section>

<section id="s13">
  <div class="stage" style="--ar:1157/1372">
    <img class="a-pop" style="left:11.24%;top:0.00%;width:68.80%" src="img/13-pic.webp" alt="">
    <button class="a-drop d1 pulse tap go" style="left:0.00%;top:74.27%;width:100.00%" aria-label="continue"><img src="img/13-word.webp" alt=""></button>
  </div>
</section>

<section id="s14">
  <div class="stage" style="--ar:995/684">
    <img class="a-pop" style="left:0.00%;top:0.00%;width:100.00%" src="img/14-text.webp" alt="">
    <button class="a-pop d2 pulse tap go" style="left:39.80%;top:73.39%;width:18.29%" aria-label="next"><img src="img/14-next.webp" alt=""></button>
  </div>
</section>

<section id="s15">
  <div class="stage" style="--ar:1548/1058">
    <img class="a-zoom float" style="left:0.00%;top:0.00%;width:100.00%" src="img/15-text.webp" alt="">
    <button class="a-pop d2 pulse tap go" style="left:43.35%;top:81.95%;width:12.98%" aria-label="next"><img src="img/15-next.webp" alt=""></button>
  </div>
</section>

<section id="s16">
  <div class="stage" style="--ar:1512/1411">
    <img class="a-drop" style="left:0.00%;top:0.00%;width:100.00%" src="img/16-title.webp" alt="">
    <img class="a-zoom d1 beat" style="left:18.65%;top:44.86%;width:61.51%" src="img/16-heart.webp" alt="">
  </div>
  <button class="replay">↺ replay</button>
</section>

<script>
  const $ = s => document.querySelector(s);
  const song = $('#song'), mute = $('.mute');
  const no = $('.no'), noHome = no.getAttribute('style');
  let cur = 0, tries = 0, opening = false;

  // 3 → 5 skips the 404 page; 404 "hmm" → 3; everything else → next
  const nextOf = n => ({ 3: 5, 4: 3 })[n] || n + 1;

  function show(n, push = true) {
    document.querySelectorAll('section.on').forEach(s => s.classList.remove('on'));
    $('#s' + n).classList.add('on');
    cur = n;
    if (n === 2) { tries = 0; no.setAttribute('style', noHome); }
    if (n === 16) confetti();
    if (push) history.pushState({ n }, '');
  }
  // phone back button = previous slide
  addEventListener('popstate', e => show(e.state?.n || 1, false));
  history.replaceState({ n: 1 }, '');
  show(1, false);

  document.addEventListener('click', e => {
    if (e.target.closest('.no, .mute, .replay')) return;
    const btn = e.target.closest('.go');
    // slides 3 and 8–13: tapping anywhere also works, in case she misses the word
    if (btn || (cur === 3 || (cur >= 8 && cur <= 13))) {
      if (cur === 1) {
        if (opening) return;
        opening = true;
        song.play().then(() => mute.style.display = 'block').catch(() => {});
        burst(btn.getBoundingClientRect()); confetti();
        return setTimeout(() => { opening = false; show(2); }, 1400);
      }
      show(nextOf(cur));
    }
  });

  // "no!" runs away; 3rd try lands on the 404 page
  function run(e) {
    e.preventDefault();
    if (++tries >= 3) return show(4);
    no.style.left = Math.random() * 60 + '%';
    no.style.top = 55 + Math.random() * 40 + '%';
  }
  no.addEventListener('pointerdown', run);
  no.addEventListener('mouseenter', run);

  $('.replay').addEventListener('click', () => show(1));
  mute.addEventListener('click', () => {
    song.muted = !song.muted;
    mute.textContent = song.muted ? '🔇' : '🔊';
  });

  // hearts + sparkles fly out of the gift
  function burst(r) {
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const bits = ['💖', '❤️', '💕', '💗', '✨', '🎆', '💘'];
    for (let i = 0; i < 40; i++) {
      const h = document.createElement('i');
      const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
      h.className = 'heart';
      h.textContent = bits[i % bits.length];
      h.style.left = cx + 'px';
      h.style.top = cy + 'px';
      h.style.fontSize = 16 + Math.random() * 22 + 'px';
      h.style.setProperty('--x', Math.cos(a) * d + 'px');
      h.style.setProperty('--y', Math.sin(a) * d + 'px');
      h.style.animationDelay = Math.random() * .25 + 's';
      document.body.append(h);
      h.addEventListener('animationend', () => h.remove());
    }
  }

  function confetti() {
    const colors = ['#FF4FA3', '#FFE066', '#5CE1E6', '#E57373', '#C77DFF', '#FF8A65'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.setProperty('--x', (Math.random() - .5) * 200 + 'px');
      c.style.animationDuration = 2 + Math.random() * 2 + 's';
      c.style.animationDelay = Math.random() * .6 + 's';
      document.body.append(c);
      c.addEventListener('animationend', () => c.remove());
    }
  }
</script>
</body>
</html>
